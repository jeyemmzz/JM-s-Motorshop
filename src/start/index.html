<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JM Motorshop - Experience the Ride</title>
    <link rel="icon" type="image/png" href="../logo-icons/logologo.png"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./design.css">

</head>
<body>
    <header class="main-header"> 
        <div class="logo-area">
            <div class="logo-icon" onclick="handleAdminClick()">
                <img src="../logo-icons/logologo.png" alt="Logo">
            </div>
        </div>

        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="../about-us/about.html">About Store</a></li>
            <li><a href="../branding/brand.html">View Shop</a></li>
        </ul>

        <div class="profile-area">
            <a href="../Profile/profile.html" class="profile-circle">
                <img src="../logo-icons/user-3-fill.png" alt="Profile">
            </a>
        </div>
    </header>

    <!-- Bike slideshow -->
    <div class="bike-container">
        <img src="../logo-icons/ducatiiii.png" alt="Ducati" class="slide active">
        <img src="../logo-icons/KTMBikes.png" alt="KTM" class="slide">
        <img src="../logo-icons/ninjabikes.png" alt="Kawasaki Ninja" class="slide">
        <img src="../logo-icons/bigbike.png" alt="Big Bike" class="slide">
        <div class="hero-overlay">
            <h1>JM <span>MOTORSHOP</span></h1>
            <p>Built for Riders, Powered by Passion</p>
        </div>
    </div>

    <script src="./starter-function.js"></script>
    
</body>
</html>
