<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts List - JM Motorshop</title>
    <link rel="icon" type="image/png" href="../logo-icons/logologo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="parts-list-design.css">
</head>
<body>

    <div class="wipe" id="wipe"></div>

    <div class="header">
        <button class="back-btn" onclick="triggerWipe('parts-categories.html')">← BACK</button>
        <h1 id="pageTitle"><span>PARTS</span></h1>
        
        <div class="cart-status" id="cartBtn" onclick="triggerWipe('../tosee_cart/cart.html')">
            🛒 <span id="cartCount" class="cart-count">0</span>
        </div>
    </div>

    <div class="search-wrapper">
        <input type="text" id="partSearch" class="search-box" placeholder="Search for parts..." onkeyup="filterParts()">
    </div>

    <div class="parts-grid" id="partsContainer"></div>

    <script>
        window.onload = () => {
            renderParts();
            updateCartCount();
        };

        function renderParts() {
            const selectedBrand = localStorage.getItem('selectedBrand');
            const selectedCat = localStorage.getItem('selectedCategory'); 
            const container = document.getElementById('partsContainer');
            
            document.getElementById('pageTitle').innerHTML = selectedCat ? `${selectedBrand} <span>${selectedCat}</span>` : "<span>PARTS</span>";

            container.innerHTML = `
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            `;

            setTimeout(() => {
                const adminInventory = JSON.parse(localStorage.getItem('jm_master_inventory')) || [];
                const liveParts = adminInventory.filter(p => 
                    p.brand === selectedBrand && p.cat === selectedCat
                );

                if (liveParts.length === 0) {
                    container.innerHTML = `<div class="empty-msg">NO ${selectedCat ? selectedCat.toUpperCase() : ''} PARTS FOUND FOR ${selectedBrand ? selectedBrand.toUpperCase() : 'THIS BRAND'}.</div>`;
                    return;
                }

                // 4. RENDER ACTUAL PARTS
                container.innerHTML = liveParts.map((item, index) => {
                    let stockClass = 'in-stock';
                    let stockText = 'IN STOCK: ' + item.stock;
                    
                    if (item.stock <= 0) {
                        stockClass = 'out-stock';
                        stockText = 'OUT OF STOCK';
                    } else if (item.stock < 10) {
                        stockClass = 'low-stock';
                        stockText = 'LOW STOCK: ' + item.stock;
                    }

                    return `
                        <div class="part-card" style="animation-delay: ${index * 0.1}s">
                            <span class="stock-badge ${stockClass}">${stockText}</span>
                            <h3>${item.name}</h3>
                            <p class="price">₱${Number(item.price).toLocaleString()}</p>
                            <button class="add-btn" 
                                ${item.stock <= 0 ? 'disabled' : ''} 
                                onclick="addToCart('${item.name}', ${item.price}, event)">
                                ${item.stock <= 0 ? 'SOLD OUT' : 'ADD TO CART'}
                            </button>
                        </div>
                    `;
                }).join('');
            }, 800); 
        }

        function filterParts() {
            let input = document.getElementById('partSearch');
            let filter = input.value.toUpperCase();
            let container = document.getElementById('partsContainer');
            let cards = container.getElementsByClassName('part-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName("h3")[0];
                if (title) {
                    let txtValue = title.textContent || title.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        cards[i].style.display = "";
                    } else {
                        cards[i].style.display = "none";
                    }
                }
            }
        }

        function addToCart(name, price, event) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ 
                id: Date.now(), 
                name: name, 
                price: price 
            });
            localStorage.setItem('cart', JSON.stringify(cart));

            const btn = event.currentTarget;
            const cartIcon = document.getElementById('cartBtn');
            
            const flyer = document.createElement('div');
            flyer.className = 'flyer';
            flyer.innerHTML = '⚙️'; 
            document.body.appendChild(flyer);

            const btnRect = btn.getBoundingClientRect();
            const cartRect = cartIcon.getBoundingClientRect();

            flyer.style.left = `${btnRect.left + btnRect.width / 2 - 12}px`;
            flyer.style.top = `${btnRect.top + btnRect.height / 2 - 12}px`;

            setTimeout(() => {
                flyer.style.left = `${cartRect.left + cartRect.width / 2 - 5}px`;
                flyer.style.top = `${cartRect.top + cartRect.height / 2 - 5}px`;
                flyer.style.transform = 'scale(0.2)';
                flyer.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                flyer.remove();
                updateCartCount();
                
                cartIcon.classList.add('cart-bounce');
                setTimeout(() => cartIcon.classList.remove('cart-bounce'), 400);

                showToast(name);
            }, 850);
        }

        function showToast(name) {
            const toast = document.createElement('div');
            toast.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#ff4d4d; color:white; padding:10px 20px; border-radius:50px; font-size:12px; font-weight:900; z-index:10000; animation: fadeInUp 0.3s ease;";
            toast.innerText = `ADDED ${name.toUpperCase()} TO CART!`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000); 
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }

        function triggerWipe(url) {
            document.getElementById('wipe').classList.add('active');
            setTimeout(() => {
                window.location.href = url;
            }, 600);
        }
    </script>
</body>
</html>
